name: l10n-guard
description: Check that translations keep their placeholders, markup, code blocks and links
author: MV2 of Munim, Inc.
branding:
  icon: globe
  color: blue
inputs:
  kind:
    description: "html, md, json, properties, arb, android, strings, dir (a whole locale folder against its source folder), or a single-file format: po, xliff, xcstrings"
    required: true
  source:
    description: "Source-language file or folder (not used for po, xliff, xcstrings)"
    required: false
    default: ""
  target:
    description: "Translated file or folder"
    required: true
  strict:
    description: "Treat warnings as errors (true/false)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        L10N_KIND: ${{ inputs.kind }}
        L10N_SOURCE: ${{ inputs.source }}
        L10N_TARGET: ${{ inputs.target }}
        L10N_STRICT: ${{ inputs.strict }}
        L10N_SCRIPT: ${{ github.action_path }}/l10n_guard.py
      run: |
        args=()
        if [ "$L10N_STRICT" = "true" ]; then args+=(--strict); fi
        case "$L10N_KIND" in
          po|xliff|xcstrings|qt)
            python3 "$L10N_SCRIPT" "${args[@]}" "$L10N_KIND" "$L10N_TARGET" ;;
          *)
            python3 "$L10N_SCRIPT" "${args[@]}" "$L10N_KIND" "$L10N_SOURCE" "$L10N_TARGET" ;;
        esac
